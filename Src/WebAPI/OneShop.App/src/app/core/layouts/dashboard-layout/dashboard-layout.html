<div
  [ngStyle]="{ display: 'flex', flexDirection: 'column', height: '100dvh', overflow: 'hidden', background: 'var(--bg-color)' }">

  <!-- Top Navbar -->
  <app-navbar [tabItems]="tabItems()" [logoUrl]="userDetails?.productLogo"
    (toggleSidebar)="toggleSidebar()"></app-navbar>

  <!-- Mobile Off-Canvas Backdrop -->
  <div *ngIf="isMobile() && mobileMenuOpen()" class="mobile-sidebar-backdrop" (click)="closeMobileMenu()"></div>

  <!-- Mobile Off-Canvas Drawer -->
  <div *ngIf="isMobile()" class="mobile-sidebar-drawer" [class.open]="mobileMenuOpen()">
    <button type="button" class="mobile-sidebar-close-btn" (click)="closeMobileMenu()" title="Close navigation menu">
      <i class="pi pi-times"></i>
    </button>
    <app-sidebar [collapsed]="false" [menuItems]="sidebarItems()" [userAvatar]="userDetails?.profilePicture"
      [userName]="userDetails?.userName" [company]="userDetails?.company"
      [tier]="userDetails?.subscriptionType || 'Basic'" (logout)="logout()"></app-sidebar>
  </div>

  <!-- Body Content Area -->
  <div [ngStyle]="{ display: 'flex', flex: '1 1 auto', overflow: 'hidden', position: 'relative' }">

    <!-- Desktop Sidebar (Only rendered on desktop) -->
    <div *ngIf="!isMobile()" class="desktop-sidebar-container">
      <app-sidebar [collapsed]="!sidebarOpen" [menuItems]="sidebarItems()" [userAvatar]="userDetails?.profilePicture"
        [userName]="userDetails?.userName" [company]="userDetails?.company"
        [tier]="userDetails?.subscriptionType || 'Basic'" (logout)="logout()"></app-sidebar>
    </div>

    <!-- Routed Page View -->
    <main class="main-content-area" [class.desktop-padding]="!isMobile()" [class.mobile-padding]="isMobile()">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Footer (Visible on desktop) -->
  <app-footer *ngIf="!isMobile()"></app-footer>

  <!-- Cart Drawer -->
  <app-cart-drawer></app-cart-drawer>

  <!-- Mobile Bottom Navigation Bar (Visible only on mobile) -->
  <nav *ngIf="isMobile()" class="mobile-bottom-nav">
    <ng-container *ngIf="isCustomer(); else vendorBottomNav">
      <!-- 1. Catalog & Shop -->
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-nav-item">
        <i class="pi pi-th-large"></i>
        <span class="label">Shop</span>
      </a>

      <!-- 2. Customer Orders -->
      <a routerLink="/dashboard/orders" routerLinkActive="active" class="mobile-nav-item">
        <i class="pi pi-shopping-bag"></i>
        <span class="label">Orders</span>
        <span *ngIf="notifService.unreadCount() > 0" class="nav-badge">{{ notifService.unreadCount() }}</span>
      </a>

      <!-- 3. Cart Quick Drawer -->
      <button type="button" class="mobile-nav-item" (click)="openCart()">
        <i class="pi pi-shopping-cart"></i>
        <span class="label">Cart</span>
        <span *ngIf="cartCount() > 0" class="nav-badge">{{ cartCount() }}</span>
      </button>

      <!-- 4. Profile / Addresses -->
      <a routerLink="/dashboard/settings" routerLinkActive="active" class="mobile-nav-item">
        <i class="pi pi-user"></i>
        <span class="label">Profile</span>
      </a>

      <!-- 5. Off-canvas Menu Toggle -->
      <button type="button" class="mobile-nav-item" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
        <span class="label">Menu</span>
      </button>
    </ng-container>

    <ng-template #vendorBottomNav>
      <!-- 1. Home / Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-nav-item">
        <i class="pi pi-home"></i>
        <span class="label">Home</span>
      </a>

      <!-- 2. Orders -->
      <a routerLink="/dashboard/orders" routerLinkActive="active" class="mobile-nav-item">
        <i class="pi pi-shopping-cart"></i>
        <span class="label">Orders</span>
        <span *ngIf="notifService.unreadCount() > 0" class="nav-badge">{{ notifService.unreadCount() }}</span>
      </a>

      <!-- 3. Items & Catalog -->
      <a routerLink="/dashboard/items" routerLinkActive="active" class="mobile-nav-item">
        <i class="pi pi-box"></i>
        <span class="label">Items</span>
      </a>

      <!-- 4. API Connectivity Console -->
      <a routerLink="/dashboard/api-connectivity" routerLinkActive="active" class="mobile-nav-item">
        <i class="pi pi-code"></i>
        <span class="label">API</span>
      </a>

      <!-- 5. All Masters & Menu -->
      <button type="button" class="mobile-nav-item" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
        <span class="label">Menu</span>
      </button>
    </ng-template>
  </nav>

  <!-- Floating Quick Cart Action Button -->
  <button (click)="openCart()" type="button" title="Open Shopping Cart" class="floating-cart-btn"
    [class.desktop-cart-pos]="!isMobile()" [class.mobile-cart-pos]="isMobile()">
    <i class="pi pi-shopping-bag" [ngStyle]="{ fontSize: isMobile() ? '1.2rem' : '1.4rem' }"></i>
    <span *ngIf="cartCount() > 0" [ngStyle]="{
            position: 'absolute',
            top: '-2px',
            right: '-2px',
            background: '#ef4444',
            color: '#ffffff',
            borderRadius: '12px',
            padding: '0.15rem 0.45rem',
            fontSize: '0.74rem',
            fontWeight: '900',
            border: '2px solid #ffffff',
            boxShadow: '0 2px 6px rgba(0,0,0,0.2)'
          }">
      {{ cartCount() }}
    </span>
  </button>
</div>
