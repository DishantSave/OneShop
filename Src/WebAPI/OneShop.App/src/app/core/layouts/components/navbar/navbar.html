<div
  [ngStyle]="{ position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 1rem', flexShrink: '0', height: '55px', background: 'var(--navbar-bg)', borderBottom: '1px solid var(--border-color)' }">
  <div [ngStyle]="{ display: 'flex', alignItems: 'center', gap: '1rem' }">
    <button (click)="toggleSidebar.emit()"
      [ngStyle]="{ background: 'transparent', border: 'none', padding: '0.25rem', cursor: 'pointer' }">
      <i class="pi pi-bars" [ngStyle]="{ fontSize: '1.25rem', color: 'var(--navbar-text)' }"></i>
    </button>

    <div [ngStyle]="{ display: 'flex', alignItems: 'center', gap: '0.75rem' }">
      <a *ngFor="let item of tabItems" [routerLink]="item.route" routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngStyle]="{ textDecoration: 'none', fontWeight: '500', padding: '0.4rem 0.5rem', color: 'var(--navbar-text)', display: 'inline-flex', alignItems: 'center', gap: '0.35rem' }">
        {{ item.label }}
        <span *ngIf="item.label.includes('Notif') && unreadNotifs() > 0" [ngStyle]="{
                background: '#ef4444', color: '#ffffff', borderRadius: '10px',
                padding: '0.05rem 0.4rem', fontSize: '0.7rem', fontWeight: '800'
              }">
          {{ unreadNotifs() }}
        </span>
      </a>
    </div>
  </div>

  <!-- App Brand Logo (Clicking opens Shopping Cart) -->
  <div (click)="openCart()" title="OneShop - Click to Open Shopping Cart" [ngStyle]="{
         position: 'absolute',
         right: 'clamp(0.5rem, 2vw, 1.5rem)',
         top: '100%',
         transform: 'translateY(-60%)',
         height: 'clamp(24px, 3.2vw, 34px)',
         overflow: 'visible',
         zIndex: '20',
         display: 'flex',
         alignItems: 'center',
         cursor: 'pointer',
         transition: 'transform 0.15s ease'
       }">
    <img [src]="resolvedLogo" alt="Logo" [ngStyle]="{ height: '100%', width: 'auto', objectFit: 'contain' }" />
  </div>
</div>
