<div [ngStyle]="{ position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 1rem', flexShrink: '0', height: '55px', background: 'var(--navbar-bg)', borderBottom: '1px solid var(--border-color)' }">
  <div [ngStyle]="{ display: 'flex', alignItems: 'center', gap: '1rem' }">
    <button (click)="toggleSidebar.emit()" [ngStyle]="{ background: 'transparent', border: 'none', padding: '0.25rem', cursor: 'pointer' }">
      <i class="pi pi-bars" [ngStyle]="{ fontSize: '1.25rem', color: 'var(--navbar-text)' }"></i>
    </button>

    <div [ngStyle]="{ display: 'flex', alignItems: 'center', gap: '1rem' }">
      <a *ngFor="let item of tabItems" [routerLink]="item.route" routerLinkActive="active-tab"
         [routerLinkActiveOptions]="{ exact: true }"
         [ngStyle]="{ textDecoration: 'none', fontWeight: '500', padding: '0.4rem 0.5rem', color: 'var(--navbar-text)' }">{{ item.label }}</a>
    </div>
  </div>

  <div [ngStyle]="{ display: 'flex', alignItems: 'center', gap: '1rem', marginRight: 'clamp(80px, 12vw, 130px)' }">
    <button (click)="openCart()"
            type="button"
            title="Shopping Cart & Segregated Checkout"
            [ngStyle]="{
              background: 'rgba(5, 81, 126, 0.08)', border: '1px solid rgba(5, 81, 126, 0.25)',
              borderRadius: '20px', padding: '0.4rem 0.85rem', display: 'flex', alignItems: 'center',
              gap: '0.45rem', cursor: 'pointer', color: 'var(--navbar-text)', fontSize: '0.85rem',
              fontWeight: '700', transition: 'all 0.2s ease'
            }">
      <i class="pi pi-shopping-bag" [ngStyle]="{ color: '#05517e', fontSize: '1rem' }"></i>
      <span>Cart</span>
      <span *ngIf="cartCount() > 0"
            [ngStyle]="{
              background: '#05517e', color: '#ffffff', borderRadius: '10px',
              padding: '0.1rem 0.45rem', fontSize: '0.72rem', fontWeight: '800'
            }">
        {{ cartCount() }}
      </span>
    </button>
  </div>

  <div [ngStyle]="{
       position: 'absolute',
       right: 'clamp(0.5rem, 2vw, 1.5rem)',
       top: '100%',
       transform: 'translateY(-60%)',
       height: 'clamp(22px, 3vw, 32px)',
       overflow: 'visible',
       zIndex: '20',
       display: 'flex',
       alignItems: 'center'
     }">
    <img [src]="resolvedLogo" alt="Logo" [ngStyle]="{ height: '100%', width: 'auto', objectFit: 'contain' }" />
  </div>
</div>
